<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Bridge • Dual Direction</title>
  <style>
    :root {
      --google-blue: #4285F4;
      --google-red: #EA4335;
      --google-green: #34A853;
      --apple-green: #30D158;
      --apple-card: rgba(255, 255, 255, 0.88);
      --text-main: #1C1C1E;
      --text-sub: #636366;
    }

    * {
      box-sizing: border-box;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: var(--apple-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 32px 28px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.6);
      width: 100%;
      max-width: 420px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(90deg, #4285F4, #000000);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.desc {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin: 0 0 24px 0;
      line-height: 1.4;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 2px solid #E5E5EA;
      background: #FFFFFF;
      border-radius: 14px;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 16px;
    }

    input:focus {
      border-color: var(--google-blue);
      box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.15);
    }

    button.convert-btn {
      width: 100%;
      padding: 16px;
      background: #000000;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    button.convert-btn:disabled {
      background: #C7C7CC;
      box-shadow: none;
      cursor: not-allowed;
    }

    .result-box {
      margin-top: 24px;
      padding: 20px;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid #E5E5EA;
      display: none;
    }

    .coords-tag {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 16px;
      background: #F2F2F7;
      padding: 10px 12px;
      border-radius: 8px;
    }

    .target-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 12px;
    }

    .btn-google { background-color: var(--google-blue); box-shadow: 0 6px 18px rgba(66, 133, 244, 0.3); }
    .btn-apple { background-color: var(--apple-green); box-shadow: 0 6px 18px rgba(48, 209, 88, 0.3); }

    .error { color: var(--google-red); font-size: 0.85rem; margin-top: 12px; font-weight: 600; display: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="brand-badge">
    <span>Google Maps</span> ⇆ <span>Apple Maps</span>
  </div>

  <h2>Universal Map Bridge</h2>
  <p class="desc">Paste a link from Google Maps or Apple Maps to convert seamlessly in either direction.</p>

  <input type="text" id="urlInput" placeholder="Paste Apple or Google Maps link, or lat, lng..." />
  <button id="convertBtn" class="convert-btn" onclick="convertLink()">Convert Link</button>

  <div class="error" id="errorMsg"></div>

  <div class="result-box" id="resultBox">
    <div class="coords-tag">
      📍 <span id="sourceText">Pin Found:</span> <strong id="coordsDisplay"></strong>
    </div>
    <a href="#" id="targetRedirectBtn" target="_blank" class="target-btn">Open Map</a>
  </div>
</div>

<script>
  async function convertLink() {
    const input = document.getElementById('urlInput').value.trim();
    const btn = document.getElementById('convertBtn');
    const errorMsg = document.getElementById('errorMsg');
    const resultBox = document.getElementById('resultBox');

    errorMsg.style.display = 'none';
    resultBox.style.display = 'none';

    if (!input) {
      showError("Please enter a valid link.");
      return;
    }

    btn.disabled = true;
    btn.innerText = "Resolving Location...";

    try {
      const response = await fetch('/api/resolve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: input })
      });

      const data = await response.json();

      if (response.ok && data.lat && data.lng) {
        showResult(data);
      } else {
        showError(data.error || "Could not resolve link.");
      }
    } catch (err) {
      showError("Server error. Please ensure your backend is running.");
    } finally {
      btn.disabled = false;
      btn.innerText = "Convert Link";
    }
  }

  function showResult(data) {
    const coordsDisplay = document.getElementById('coordsDisplay');
    const targetRedirectBtn = document.getElementById('targetRedirectBtn');
    const resultBox = document.getElementById('resultBox');

    const source = data.detectedPlatform ? `From ${data.detectedPlatform}: ` : 'Pin found: ';
    document.getElementById('sourceText').innerText = source;
    coordsDisplay.innerText = data.name
      ? `${data.name} (${data.lat}, ${data.lng})`
      : `${data.lat}, ${data.lng}`;
    targetRedirectBtn.href = data.targetUrl;
    targetRedirectBtn.innerText = `Open in ${data.targetPlatform}`;

    // Apply button styling based on destination platform
    if (data.targetPlatform === 'Google Maps') {
      targetRedirectBtn.className = 'target-btn btn-google';
    } else {
      targetRedirectBtn.className = 'target-btn btn-apple';
    }

    resultBox.style.display = 'block';
  }

  function showError(msg) {
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.innerText = msg;
    errorMsg.style.display = 'block';
  }

  document.getElementById('urlInput').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      convertLink();
    }
  });
</script>

</body>
</html>
